name: Release candidate

# Release candidates are tagged by hand (vX.Y.Z-rc.N) to test install and
# upgrade against a real release before the stable one.
on:
  push:
    tags: ["v*-rc.*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # release-please owns stable notes, so goreleaser's changelog is off and
      # ignores --release-notes. A candidate gets its commits since the last
      # stable tag instead.
      - run: |
          sh scripts/rc-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/rc-notes.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/rc-notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
